<div class="contenedor">

  <h2 class="titulo">
    <mat-icon>construction</mat-icon>
    Inventario - Acero y Varillas
  </h2>

  <!-- BUSCADOR -->
  <mat-form-field appearance="outline" class="buscador">
    <mat-label>Buscar material</mat-label>
    <input matInput (keyup)="aplicarFiltro($event)" placeholder="Código, descripción, unidad...">
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <!-- TABLA -->
  <div class="tabla-container mat-elevation-z4">
    <table mat-table [dataSource]="dataSource" matSort>

      <!-- CODIGO -->
      <ng-container matColumnDef="codigo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Código</th>
        <td mat-cell *matCellDef="let element">
          {{ element.codigo }}
        </td>
      </ng-container>

      <!-- DESCRIPCION -->
      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Descripción</th>
        <td mat-cell *matCellDef="let element">
          {{ element.descripcion }}
        </td>
      </ng-container>

      <!-- UNIDAD -->
      <ng-container matColumnDef="unidad">
        <th mat-header-cell *matHeaderCellDef>Unidad</th>
        <td mat-cell *matCellDef="let element">
          {{ element.unidad }}
        </td>
      </ng-container>

      <!-- PRECIO -->
      <ng-container matColumnDef="precio">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Precio</th>
        <td mat-cell *matCellDef="let element">
          ${{ element.precio }}
        </td>
      </ng-container>

      <!-- STOCK -->
      <ng-container matColumnDef="stock">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Stock</th>
        <td mat-cell *matCellDef="let element">
          {{ element.stock }}
        </td>
      </ng-container>

      <!-- ACCIONES -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let element">

          <button mat-icon-button color="primary" (click)="editar(element)">
            <mat-icon>edit</mat-icon>
          </button>

          <button mat-icon-button color="warn" (click)="eliminar(element.id)">
            <mat-icon>delete</mat-icon>
          </button>

        </td>
      </ng-container>

      <!-- FILAS -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

    <!-- PAGINADOR -->
    <mat-paginator [pageSize]="5"
                   [pageSizeOptions]="[5, 10, 20]">
    </mat-paginator>

  </div>

</div>
