<div class="container">

  <div class="form-section">

    <h1 class="form-title">
      <mat-icon class="title-icon">engineering</mat-icon>
      Registro de Equipos de construccion
    </h1>

    <form [formGroup]="form"
          (ngSubmit)="guardar()"
          class="material-form">

      <!-- CODIGO -->
      <mat-form-field appearance="outline" class="codigo-field">
        <mat-label>Código</mat-label>
        <input matInput formControlName="codigo" readonly>
        <mat-icon matPrefix>qr_code</mat-icon>
      </mat-form-field>

      <!-- DESCRIPCION -->
      <mat-form-field appearance="outline">
        <mat-label>Descripción</mat-label>
        <input matInput formControlName="descripcion">
        <mat-icon matPrefix>description</mat-icon>
      </mat-form-field>

      <!-- UNIDAD -->
      <mat-form-field appearance="outline">
        <mat-label>Unidad</mat-label>
        <input matInput formControlName="unidad">
        <mat-icon matPrefix>straighten</mat-icon>
      </mat-form-field>

      <!-- PRECIO -->
      <mat-form-field appearance="outline">
        <mat-label>Precio</mat-label>
        <input matInput type="number" formControlName="precio">
        <mat-icon matPrefix>attach_money</mat-icon>
      </mat-form-field>

      <button mat-raised-button
              class="btn-guardar"
              type="submit"
              [disabled]="form.invalid">
        <mat-icon>{{ modoEdicion ? 'edit' : 'save' }}</mat-icon>
        {{ modoEdicion ? 'Actualizar' : 'Guardar' }}
      </button>

      <button mat-raised-button
          class="btn-nuevo"
          type="button"
          (click)="nuevoRegistro()">
        <mat-icon>add</mat-icon>
        Nuevo registro
      </button>

    </form>
  </div>

  <!-- ================= FILTRO ================= -->

  <mat-form-field appearance="outline" class="filtro-campo">
    <mat-label>Buscar equipo de construccion</mat-label>
    <input matInput (keyup)="aplicarFiltro($event)" placeholder="Código o descripción">
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <!-- ================= TABLA ================= -->

  <mat-card class="tabla-section">
    <table mat-table
           [dataSource]="dataSource"
           matSort
           matSortActive="codigo"
           matSortDirection="asc">

      <!-- CODIGO -->
      <ng-container matColumnDef="codigo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Código </th>
        <td mat-cell *matCellDef="let element"> {{element.codigo}} </td>
      </ng-container>

      <!-- DESCRIPCION -->
      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Descripción </th>
        <td mat-cell *matCellDef="let element"> {{element.descripcion}} </td>
      </ng-container>

      <!-- UNIDAD -->
      <ng-container matColumnDef="unidad">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Unidad </th>
        <td mat-cell *matCellDef="let element"> {{element.unidad}} </td>
      </ng-container>

      <!-- PRECIO -->
      <ng-container matColumnDef="precio">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Precio </th>
        <td mat-cell *matCellDef="let element"> ${{element.precio}} </td>
      </ng-container>

      <!-- ACCIONES -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>

        <td mat-cell *matCellDef="let element">

          <button mat-icon-button class="btn-editar" (click)="editar(element)">
            <mat-icon>edit</mat-icon>
          </button>

          <button mat-icon-button class="btn-eliminar" (click)="eliminar(element.id)">
            <mat-icon>delete</mat-icon>
          </button>

        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row
          *matRowDef="let row; columns: displayedColumns;"
          [attr.data-codigo]="row.codigo"
          [class.fila-destacada]="row.codigo === filaActualizada">
      </tr>
    </table>

    <!-- PAGINADOR -->
    <mat-paginator
      [pageSize]="10"
      [pageSizeOptions]="[5,10,20]"
      showFirstLastButtons>
    </mat-paginator>

  </mat-card>

</div>
