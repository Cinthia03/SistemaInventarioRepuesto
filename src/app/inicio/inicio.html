<div class="container">

  <h1 class="titulo">Sistema de Gestión Constructora</h1>

  <div class="cards">
    <!-- INVENTARIO -->
    <mat-card class="card inventario" (click)="irInventario()">
      <mat-icon>inventory_2</mat-icon>
      <h2>INVENTARIO</h2>
      <p>Gestión completa de materiales</p>
    </mat-card>

    <!-- CALCULO -->
    <mat-card class="card calculo" (click)="irCalculo()">
      <mat-icon>calculate</mat-icon>
      <h2>CALCULO</h2>
      <p>Herramientas de cálculo estructural</p>
    </mat-card>

    <!-- PRESUPUESTO -->
    <mat-card class="card presupuesto" (click)="irPresupuesto()">
      <mat-icon>request_quote</mat-icon>
      <h2>PRESUPUESTO</h2>
      <p>Control y generación de presupuestos</p>
    </mat-card>
  </div>
</div>
